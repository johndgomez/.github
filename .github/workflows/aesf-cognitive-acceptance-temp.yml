name: AESF Cognitive Acceptance Temporary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  copilot-requests: write

jobs:
  cognitive-acceptance:
    if: github.event.issue.title == 'AESF-LIVE-CGN-20260828-003'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run governed cognitive acceptance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AESF_PROMPT: |
            You are the independent live cognitive acceptance evaluator for an Agentic Enterprise Software Factory.

            Fresh acceptance run ID: AESF-LIVE-GH-20260828-003.
            Minimal nontechnical business idea: "Quiero un sistema para que una biblioteca comunitaria preste libros y sepa quién los tiene."

            Execute the cognitive work yourself. Do not ask the user technical questions. Use live public-web research through the available web tools. Research at least four authoritative primary or standards-maintainer sources, preferring organizations such as the Library of Congress, Dublin Core Metadata Initiative, IFLA, NISO, W3C, OWASP, ISO pages, or equivalent authoritative maintainers where directly relevant. Do not invent standards, legal duties, dates, product constraints, service levels, jurisdiction, budgets, or user intent.

            Demonstrate all of the following in one run: interpret intent while preserving unknowns; perform live external research with exact authoritative URLs; separate sourced facts from engineering inference and assumptions; identify contradictions/tensions without fabricating them; derive multi-category requirements; evaluate at least three materially different architecture alternatives; define deterministic proof obligations; identify risks and only irreducible human escalations; and produce a traceable provider-neutral decision basis.

            Return ONLY one valid JSON object, no Markdown fences and no prose outside JSON. Use this exact top-level shape:
            {
              "run_id": "AESF-LIVE-GH-20260828-003",
              "idea": "...",
              "intent": {"business_outcomes": [], "actors": [], "in_scope": [], "out_of_scope_for_first_increment": []},
              "research": {
                "sources": [{"title": "", "url": "", "authority": "", "supported_facts": []}],
                "facts": [{"statement": "", "source_urls": []}],
                "engineering_inferences": [{"statement": "", "basis": ""}],
                "assumptions": [{"statement": "", "status": "open|bounded"}],
                "contradictions_or_tensions": [{"description": "", "resolution": ""}],
                "unknowns": []
              },
              "requirements": [{"id": "", "category": "", "statement": "", "acceptance_criteria": [], "source_or_basis": []}],
              "architecture": {
                "alternatives": [{"name": "", "advantages": [], "disadvantages": [], "failure_modes": [], "lifecycle_cost": "", "reversibility": "", "provider_neutrality": ""}],
                "selected_for_first_increment": "",
                "decision_basis": [],
                "rejected_or_deferred": []
              },
              "risks": [{"risk": "", "mitigation": "", "residual_unknown": ""}],
              "proof_obligations": [{"id": "", "claim": "", "verification_method": "", "deterministic": true}],
              "human_escalations": [{"question": "", "why_irreducible": ""}],
              "quality_assertions": {
                "live_external_research_required": true,
                "facts_separated_from_inference": true,
                "no_invented_legal_or_compliance_claims": true,
                "provider_neutral": true,
                "ordinary_technology_choices_not_escalated": true
              }
            }

            The result is invalid if it contains fewer than four authoritative source URLs, treats inference as sourced fact, invents legal/compliance obligations, omits deterministic proof obligations, or asks the human to choose a routine technology stack.
        run: |
          set +e
          copilot \
            -p "$AESF_PROMPT" \
            --no-ask-user \
            --no-custom-instructions \
            --no-remote \
            --no-remote-export \
            --no-auto-update \
            --no-color \
            --output-format=json \
            --model=auto \
            --max-ai-credits=100 \
            --available-tools='web_search,web_fetch' \
            --allow-tool='url' \
            --allow-all-urls \
            --secret-env-vars=GITHUB_TOKEN \
            --log-level=none \
            > copilot.out 2>copilot.err
          status=$?
          echo "AESF_COPILOT_EXIT=$status"
          echo "===AESF_COGNITIVE_STDOUT_BEGIN==="
          cat copilot.out
          echo "===AESF_COGNITIVE_STDOUT_END==="
          if [ -s copilot.err ]; then
            echo "===AESF_COGNITIVE_STDERR_BEGIN==="
            cat copilot.err
            echo "===AESF_COGNITIVE_STDERR_END==="
          fi
          exit "$status"
